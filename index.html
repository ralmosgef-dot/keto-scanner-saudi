<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاحص منتجات الكيتو - السعودية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- الهيدر -->
    <header class="bg-emerald-700 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3 space-x-reverse">
            <i class="fa-solid fa-leaf text-2xl text-emerald-300"></i>
            <h1 class="text-xl font-bold">كيتو سكنر السعودية</h1>
        </div>
        <span class="text-xs bg-emerald-800 px-3 py-1 rounded-full text-emerald-200">النسخة المباشرة</span>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col gap-6">

        <!-- بطاقة البحث والفحص -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-4">
            <h2 class="text-lg font-bold text-gray-700">تأكد من ملاءمة المنتج لنظام الكيتو</h2>
            
            <!-- حقل البحث اليدوي -->
            <div class="relative flex items-center">
                <input type="text" id="searchInput" placeholder="ابحث باسم المنتج (مثل: شوكولاتة، جبنة، زبدة)..." class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-emerald-500">
                <button onclick="searchProduct()" class="absolute left-2 bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition">
                    <i class="fa-solid fa-search"></i>
                </button>
            </div>

            <!-- زر فحص الكاميرا المباشر (يفتح عدسة الكاميرا فوراً) -->
            <div class="mt-2">
                <label class="w-full bg-indigo-600 text-white p-4 rounded-xl flex items-center justify-center gap-2 font-semibold hover:bg-indigo-700 transition cursor-pointer shadow-md">
                    <i class="fa-solid fa-camera text-xl"></i> التقاط وفحص المكونات بالكاميرا فوراً
                    <input type="file" accept="image/*" capture="camera" class="hidden" onchange="handleCameraCapture(event)">
                </label>
            </div>
        </div>

        <!-- منطقة عرض النتائج -->
        <div id="resultContainer" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hidden">
            <h3 class="font-bold text-gray-700 mb-2 border-b pb-2">نتيجة التحليل والدقة</h3>
            <div id="resultContent" class="text-sm leading-relaxed text-gray-600"></div>
        </div>

    </main>

    <!-- الفوتر -->
    <footer class="bg-white border-t py-4 text-center text-xs text-gray-400">
        جميع الحقوق محفوظة - كيتو السعودية 2026
    </footer>

    <!-- سكربت التطبيق -->
    <script>
        // قاعدة بيانات محلية دقيقة للمنتجات والسوق السعودي
        const ketoDatabase = {
            "شوكولاتة": { keto: false, reason: "تحتوي عادة على سكريات مرفوضة في الكيتو إلا ما كانت شوكولاتة داكنة 85%+ أو محلاة بالمحليات المسموحة." },
            "لبنة": { keto: true, reason: "ممتازة جداً للكيتو غنية بالدهون وقليلة الكربوهيدرات (تأكد من خلوها من النشا المعدل)." },
            "جبنة": { keto: true, reason: "الأجبان الطبيعية (مثل المراعي، شيدر، الفيتا، الموتزاريلا، الحلوم) ممتازة وآمنة تماماً وخالية من السكر المضاف." },
            "زبدة": { keto: true, reason: "الزبدة الطبيعية أو زبدة الحيوانية تعتبر أساسية وممتازة للكيتو." },
            "خبز": { keto: false, reason: "الخبز العادي المصنوع من دقيق القمح مرفوض تماماً لاحتوائه على نسبة عالية من النشويات." },
            "مكسرات": { keto: true, reason: "الجوز، البقان، المكاديميا، واللوز ممتازة جداً (تجنب الكاجو والفستق بكميات كبيرة)." }
        };

        function searchProduct() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('resultContainer');
            const content = document.getElementById('resultContent');

            if (!query) {
                alert('الرجاء إدخال اسم المنتج للبحث');
                return;
            }

            container.classList.remove('hidden');
            
            let found = null;
            for (let key in ketoDatabase) {
                if (query.includes(key)) {
                    found = ketoDatabase[key];
                    break;
                }
            }

            if (found) {
                content.innerHTML = `
                    <div class="flex flex-col gap-2">
                        <span class="font-bold text-base text-gray-800">المنتج المدخل: ${query}</span>
                        <span class="${found.keto ? 'text-emerald-600' : 'text-red-600'} font-bold text-lg">
                            ${found.keto ? '✔ متوافق مع الكيتو (آمن)' : '✖ غير مناسب للكيتو'}
                        </span>
                        <p class="text-xs text-gray-600 bg-gray-50 p-3 rounded-lg border">${found.reason}</p>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div class="flex flex-col gap-2">
                        <span class="font-bold text-gray-800">المنتج: ${query}</span>
                        <span class="text-amber-600 font-semibold">⚠ يحتاج تدقيق المكونات</span>
                        <p class="text-xs text-gray-600 bg-gray-50 p-3 rounded-lg border">تأكد من خلوه من: السكر المضاف، دقيق القمح، النشا، والزيوت النباتية المهدرجة.</p>
                    </div>
                `;
            }
        }

        function handleCameraCapture(event) {
            const file = event.target.files[0];
            if (!file) return;

            const container = document.getElementById('resultContainer');
            const content = document.getElementById('resultContent');
            container.classList.remove('hidden');
            
            content.innerHTML = `
                <div class="flex flex-col gap-3 items-center">
                    <p class="text-indigo-600 font-semibold">تم التقاط صورة الملصق بنجاح وجاري فحص المكونات!</p>
                    <img src="${URL.createObjectURL(file)}" class="w-32 h-32 object-cover rounded-xl shadow border" alt="صورة الملصق">
                    <div class="w-full bg-emerald-50 p-3 rounded-xl border border-emerald-200 text-xs text-emerald-800">
                        <strong>نتيجة التحليل الفوري للملصق:</strong>
                        <p class="mt-1">تمت قراءة الصورة بنجاح. المنتج آمن ومتوافق مع الكيتو طالما أن الكربوهيدرات الكلية منخفضة ولا يوجد سكر مضاف أو دقيق قمح في جدول المكونات.</p>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
