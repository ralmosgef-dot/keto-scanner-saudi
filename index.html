<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاحص منتجات الكيتو - السعودية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- الهيدر -->
    <header class="bg-emerald-700 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3 space-x-reverse">
            <i class="fa-solid fa-leaf text-2xl text-emerald-300"></i>
            <h1 class="text-xl font-bold">كيتو سكنر السعودية</h1>
        </div>
        <span class="text-xs bg-emerald-800 px-3 py-1 rounded-full text-emerald-200">النسخة الذكية</span>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col gap-6">

        <!-- بطاقة الترحيب والبحث -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-4">
            <h2 class="text-lg font-bold text-gray-700">تأكد من ملاءمة المنتج لنظام الكيتو</h2>
            
            <!-- حقل البحث اليدوي والباركود -->
            <div class="relative flex items-center">
                <input type="text" id="searchInput" placeholder="ابحث باسم المنتج أو أدخل الباركود..." class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-emerald-500">
                <button onclick="searchProduct()" class="absolute left-2 bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition">
                    <i class="fa-solid fa-search"></i>
                </button>
            </div>

            <!-- أزرار العمليات السريعة -->
            <div class="grid grid-cols-2 gap-3 mt-2">
                <button onclick="openLiveScanner()" class="bg-emerald-50 text-emerald-700 border border-emerald-200 p-3 rounded-xl flex items-center justify-center gap-2 font-semibold hover:bg-emerald-100 transition">
                    <i class="fa-solid fa-camera"></i> مسح باركود مباشر
                </button>
                <button onclick="openAiScanner()" class="bg-indigo-50 text-indigo-700 border border-indigo-200 p-3 rounded-xl flex items-center justify-center gap-2 font-semibold hover:bg-indigo-100 transition">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> فحص المكونات (AI)
                </button>
            </div>
        </div>

        <!-- منطقة عرض النتائج -->
        <div id="resultContainer" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hidden">
            <h3 class="font-bold text-gray-700 mb-2 border-b pb-2">نتيجة الفحص</h3>
            <div id="resultContent" class="text-sm leading-relaxed text-gray-600"></div>
        </div>

    </main>

    <!-- نافذة مسح الباركود المباشر (Live Scanner Modal) -->
    <div id="scannerModal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="relative w-full max-w-md bg-black rounded-2xl overflow-hidden shadow-2xl flex flex-col items-center">
            <video id="scannerVideo" class="w-full h-80 object-cover" autoplay playsinline></video>
            <div class="absolute inset-0 border-2 border-emerald-500/50 pointer-events-none m-12 rounded-xl flex items-center justify-center">
                <span class="text-white bg-black/60 px-3 py-1 rounded text-xs">وجه الكاميرا نحو الباركود</span>
            </div>
            <div class="p-4 w-full bg-gray-900 flex justify-between items-center">
                <span id="scannerStatus" class="text-xs text-emerald-400">جاري تشغيل الكاميرا...</span>
                <button onclick="closeLiveScanner()" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- نافذة فحص الذكاء الاصطناعي للمكونات -->
    <div id="aiModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white max-w-md w-full p-6 rounded-2xl shadow-xl flex flex-col gap-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-gray-700">فحص المكونات بالذكاء الاصطناعي</h3>
                <button onclick="closeAiScanner()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-gray-500">اختر صورة ملصق المكونات من هاتفك لتقييمها للكيتو فوراً:</p>
            <input type="file" id="aiImageInput" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
            <button onclick="analyzeWithAi()" class="bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 transition">تحليل المكونات</button>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="bg-white border-t py-4 text-center text-xs text-gray-400">
        جميع الحقوق محفوظة - كيتو السعودية 2026
    </footer>

    <!-- سكربت التطبيق -->
    <script>
        let videoStream = null;
        let barcodeDetector = null;
        let scanningActive = false;

        // التحقق من دعم الـ BarcodeDetector في المتصفح
        if ('BarcodeDetector' in window) {
            barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
        }

        async function openLiveScanner() {
            const modal = document.getElementById('scannerModal');
            const video = document.getElementById('scannerVideo');
            const status = document.getElementById('scannerStatus');
            
            if (!barcodeDetector) {
                alert('متصفحك لا يدعم قراءة الباركود المباشر. يمكنك استخدام إدخال الباركود اليدوي أو رفع الصورة.');
                return;
            }

            modal.classList.remove('hidden');
            scanningActive = true;

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = videoStream;
                await video.play();
                status.innerText = "جاري البحث عن باركود...";
                scanFrame();
            } catch (err) {
                console.error(err);
                status.innerText = "تعذر الوصول للكاميرا!";
                setTimeout(closeLiveScanner, 2000);
            }
        }

        async function scanFrame() {
            const video = document.getElementById('scannerVideo');
            if (!scanningActive) return;

            try {
                const barcodes = await barcodeDetector.detect(video);
                if (barcodes.length > 0) {
                    const code = barcodes[0].rawValue;
                    closeLiveScanner();
                    document.getElementById('searchInput').value = code;
                    searchProduct();
                    return;
                }
            } catch (err) {
                console.error(err);
            }
            if (scanningActive) {
                requestAnimationFrame(scanFrame);
            }
        }

        function closeLiveScanner() {
            scanningActive = false;
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            document.getElementById('scannerModal').classList.add('hidden');
        }

        function openAiScanner() {
            document.getElementById('aiModal').classList.remove('hidden');
        }

        function closeAiScanner() {
            document.getElementById('aiModal').classList.add('hidden');
        }

        function searchProduct() {
            const query = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('resultContainer');
            const content = document.getElementById('resultContent');

            if (!query) {
                alert('الرجاء إدخال اسم المنتج أو الباركود');
                return;
            }

            container.classList.remove('hidden');
            content.innerHTML = `<p class="text-emerald-600">جاري البحث عن المنتج (${query}) في قاعدة البيانات...</p>`;

            // محاكاة نتيجة البحث (يمكن ربطه بـ Open Food Facts API مباشرة)
            setTimeout(() => {
                content.innerHTML = `
                    <div class="flex flex-col gap-2">
                        <span class="font-bold text-gray-800">المنتج: ${query}</span>
                        <span class="text-emerald-600 font-semibold">✔ متوافق مع نظام الكيتو (آمن)</span>
                        <p class="text-xs text-gray-500">الخلو من السكريات المضافة والنشويات العالية.</p>
                    </div>
                `;
            }, 1000);
        }

        function analyzeWithAi() {
            const fileInput = document.getElementById('aiImageInput');
            if (fileInput.files.length === 0) {
                alert('الرجاء اختيار صورة الملصق أولاً');
                return;
            }
            closeAiScanner();
            const container = document.getElementById('resultContainer');
            const content = document.getElementById('resultContent');
            container.classList.remove('hidden');
            content.innerHTML = `<p class="text-indigo-600">جاري تحليل المكونات عبر الذكاء الاصطناعي (Gemini)...</p>`;
            
            setTimeout(() => {
                content.innerHTML = `
                    <div class="flex flex-col gap-2">
                        <span class="font-bold text-indigo-800">نتيجة فحص الذكاء الاصطناعي:</span>
                        <span class="text-red-500 font-semibold">✖ غير مناسب للكيتو (يحتوي على دقيق القمح / سكر)</span>
                        <p class="text-xs text-gray-500>تم رصد مكونات غير مسموحة في السعرات والنشويات الخفية.</p>
                    </div>
                `;
            }, 1500);
        }
    </script>
</body>
</html>
